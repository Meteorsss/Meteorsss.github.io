<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>雨夜 · 便利店街角</title>
<meta name="description" content="雨夜里的便利店街角：灯光、积水倒影与城市微景观，可拖动旋转、缩放欣赏的 3D 场景。" />
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05070d; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; width:100%; height:100%; }

  .home-link { position:fixed;z-index:10;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border:1px solid rgba(255,255,255,.28);border-radius:24px;background:rgba(10,14,28,.78);color:#f5f2e9;text-decoration:none;font:14px/1.5 system-ui,sans-serif; }
  .home-link:hover { background:rgba(10,14,28,.95); }
  .home-link:focus-visible { outline:2px solid #fff;outline-offset:3px; }
</style>
</head>
<body>
<a class="home-link" href="/" aria-label="返回首页">← 返回首页</a>
<div id="app"></div>
<script type="text/plain" id="appsrc">
/* =========================================================================
   雨夜 · 便利店街角   toon-shaded collectible diorama
   ========================================================================= */
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { Reflector }       from 'three/addons/objects/Reflector.js';

/* ---------------------------------------------------------------- renderer */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0e1c, 0.0105);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(10.5, 9.3, 13.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-2.4, 1.60, -2.4);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 9;
controls.maxDistance = 46;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI * 0.4915;
controls.rotateSpeed = 0.62;
controls.zoomSpeed = 0.85;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;

/* optional deep-link camera:  #cam=px,py,pz,tx,ty,tz */
if (location.hash.indexOf('#cam=') === 0) {
  const v = location.hash.slice(5).split(',').map(Number).filter(n => !isNaN(n));
  if (v.length >= 6) {
    camera.position.set(v[0], v[1], v[2]);
    controls.target.set(v[3], v[4], v[5]);
    controls.autoRotate = false;
    window.__lockCam = true;
  }
}

/* ------------------------------------------------------------------- layout */
const L = {
  half: 8,
  sw: 0.16,                                   // sidewalk height
  store: { x0: -6.4, x1: -0.4, z0: -7.6, z1: -0.4, top: 3.42 },
  int:   { x0: -6.22, x1: -0.58, z0: -5.85, z1: -0.58, floor: 0.20, ceil: 2.62 },
  road:  { a0: 1.4, a1: 4.8 }
};
const S = L.store;

const COL = {
  asphalt:  0x24262f,
  walk:     0x7d8697,
  curb:     0x9aa4b4,
  paint:    0xc6ccd8,
  wall:     0xcfd2d6,
  wallShade:0xc9c2b2,
  frame:    0x39414b,
  darkMetal:0x2b323b,
  metal:    0x8b96a3,
  green:    0x2f9e8b,
  orange:   0xf0a24a,
  blue:     0x3f6fb0,
  red:      0xd9503f,
  warm:     0xffe6bd
};

/* ----------------------------------------------------------------- helpers */
const root = new THREE.Group();
scene.add(root);

const BOX   = new THREE.BoxGeometry(1, 1, 1);
const EDGES = new THREE.EdgesGeometry(BOX);
const CYL   = new THREE.CylinderGeometry(0.5, 0.5, 1, 16, 1, false);
const CYL_E = new THREE.EdgesGeometry(CYL);
const SPH   = new THREE.SphereGeometry(0.5, 18, 12);
const PLN   = new THREE.PlaneGeometry(1, 1);

const lineMat  = new THREE.LineBasicMaterial({ color: 0x0a0d16, transparent: true, opacity: 0.92 });
const hullMat  = new THREE.MeshBasicMaterial({ color: 0x0a0d16, side: THREE.BackSide });
const lineMat2 = new THREE.LineBasicMaterial({ color: 0x141a28, transparent: true, opacity: 0.55 });

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

function addBox(parent, mat, w, h, d, x, y, z, opt) {
  opt = opt || {};
  const m = new THREE.Mesh(BOX, mat);
  m.scale.set(w, h, d);
  m.position.set(x, y, z);
  if (opt.rot) m.rotation.set(opt.rot[0] || 0, opt.rot[1] || 0, opt.rot[2] || 0);
  m.castShadow = opt.cast !== false;
  m.receiveShadow = opt.recv !== false;
  if (opt.outline !== false) {
    const l = new THREE.LineSegments(EDGES, opt.lineMat || lineMat);
    l.scale.setScalar(1.003);
    m.add(l);
  }
  parent.add(m);
  return m;
}

function addCyl(parent, mat, r, h, x, y, z, opt) {
  opt = opt || {};
  const m = new THREE.Mesh(CYL, mat);
  m.scale.set(r * 2, h, r * 2);
  m.position.set(x, y, z);
  if (opt.rot) m.rotation.set(opt.rot[0] || 0, opt.rot[1] || 0, opt.rot[2] || 0);
  m.castShadow = opt.cast !== false;
  m.receiveShadow = opt.recv !== false;
  if (opt.outline) {
    const l = new THREE.LineSegments(CYL_E, lineMat);
    l.scale.setScalar(1.004);
    m.add(l);
  }
  if (opt.hull) {
    const hl = new THREE.Mesh(CYL, hullMat);
    hl.scale.set(1.08, 1.0, 1.08);
    m.add(hl);
  }
  parent.add(m);
  return m;
}

function addSphere(parent, mat, r, x, y, z, opt) {
  opt = opt || {};
  const m = new THREE.Mesh(SPH, mat);
  m.scale.setScalar(r * 2);
  m.position.set(x, y, z);
  m.castShadow = opt.cast !== false;
  m.receiveShadow = opt.recv !== false;
  parent.add(m);
  return m;
}

function addPlane(parent, mat, w, h, x, y, z, rotX, rotY, rotZ) {
  const m = new THREE.Mesh(PLN, mat);
  m.scale.set(w, h, 1);
  m.position.set(x, y, z);
  m.rotation.set(rotX === undefined ? -Math.PI / 2 : rotX, rotY || 0, rotZ || 0);
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/** cylinder between two world-ish points (in parent space) */
function tube(parent, mat, a, b, r, seg) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(CYL, mat);
  m.scale.set(r * 2, len, r * 2);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/* toon ramp */
const gradientMap = (() => {
  const data = new Uint8Array([58, 112, 172, 222, 255]);
  const t = new THREE.DataTexture(data, data.length, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
})();

const matCache = new Map();
function toon(color, opts) {
  const key = color + '|' + (opts ? JSON.stringify(opts) : '');
  let m = matCache.get(key);
  if (!m) {
    m = new THREE.MeshToonMaterial(Object.assign({ color: color, gradientMap: gradientMap }, opts || {}));
    matCache.set(key, m);
  }
  return m;
}
function basic(color, opts) {
  return new THREE.MeshBasicMaterial(Object.assign({ color: color }, opts || {}));
}

/* glow sprite */
const glowTex = canvasTex(128, 128, (g, W, H) => {
  const grd = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W / 2);
  grd.addColorStop(0.0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.18, 'rgba(255,255,255,0.62)');
  grd.addColorStop(0.45, 'rgba(255,255,255,0.16)');
  grd.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);
});
function glow(color, size, x, y, z, opacity, parent) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: color, transparent: true, opacity: opacity === undefined ? 0.55 : opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true, fog: false
  }));
  s.scale.set(size, size, 1);
  s.position.set(x, y, z);
  (parent || root).add(s);
  return s;
}
/* soft pool of light on the ground */
const poolTex = canvasTex(256, 256, (g, W, H) => {
  const grd = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W / 2);
  grd.addColorStop(0.0, 'rgba(255,255,255,0.95)');
  grd.addColorStop(0.35, 'rgba(255,255,255,0.35)');
  grd.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);
});
function lightPool(color, size, x, y, z, opacity) {
  const m = new THREE.Mesh(PLN, new THREE.MeshBasicMaterial({
    map: poolTex, color: color, transparent: true, opacity: opacity === undefined ? 0.5 : opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));
  m.scale.set(size, size, 1);
  m.position.set(x, y, z);
  m.rotation.x = -Math.PI / 2;
  root.add(m);
  return m;
}

/* ------------------------------------------------------------------- lights */
const hemi = new THREE.HemisphereLight(0x6379c4, 0x171820, 0.52);
scene.add(hemi);

const moon = new THREE.DirectionalLight(0xb6ccff, 1.05);
moon.position.set(-13, 19, 11);
moon.castShadow = true;
moon.shadow.mapSize.set(1536, 1536);
moon.shadow.camera.left = -13;
moon.shadow.camera.right = 13;
moon.shadow.camera.top = 13;
moon.shadow.camera.bottom = -13;
moon.shadow.camera.near = 1;
moon.shadow.camera.far = 60;
moon.shadow.bias = -0.0012;
moon.shadow.normalBias = 0.02;
scene.add(moon);

const fill = new THREE.DirectionalLight(0x6b7cff, 0.22);
fill.position.set(12, 7, -14);
scene.add(fill);

/* interior warmth */
const storeLight1 = new THREE.PointLight(0xffc98a, 7.6, 10, 2);
storeLight1.position.set(-4.0, 2.28, -3.6);
scene.add(storeLight1);
const storeLight2 = new THREE.PointLight(0xffd0a0, 5.8, 9, 2);
storeLight2.position.set(-1.7, 2.28, -2.0);
scene.add(storeLight2);
const storeLight3 = new THREE.PointLight(0xffd0a0, 4.6, 8, 2);
storeLight3.position.set(-2.6, 2.28, -4.9);
scene.add(storeLight3);

/* --------------------------------------------------------------- sky dome */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: {
    cTop: { value: new THREE.Color(0x04070f) },
    cMid: { value: new THREE.Color(0x101733) },
    cBot: { value: new THREE.Color(0x241a35) }
  },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: [
    'varying vec3 vP; uniform vec3 cTop, cMid, cBot;',
    'void main(){',
    '  float h = normalize(vP).y;',
    '  vec3 c = mix(cBot, cMid, smoothstep(-0.25, 0.22, h));',
    '  c = mix(c, cTop, smoothstep(0.18, 0.9, h));',
    '  float glow = pow(max(0.0, 1.0 - abs(h) * 5.0), 3.0);',
    '  c += vec3(0.085, 0.055, 0.115) * glow;',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n')
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(140, 32, 20), skyMat);
sky.frustumCulled = false;
scene.add(sky);

/* =====================================================================
   TEXTURES
   ===================================================================== */
const texAsphalt = canvasTex(512, 512, (g, W, H) => {
  g.fillStyle = '#23252e'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 9000; i++) {
    const v = Math.random();
    g.fillStyle = v > 0.6 ? 'rgba(180,190,210,' + (0.02 + Math.random() * 0.06) + ')'
                          : 'rgba(0,0,0,' + (0.05 + Math.random() * 0.18) + ')';
    const s = 1 + Math.random() * 3;
    g.fillRect(Math.random() * W, Math.random() * H, s, s);
  }
  for (let i = 0; i < 26; i++) {
    g.strokeStyle = 'rgba(10,12,18,' + (0.12 + Math.random() * 0.25) + ')';
    g.lineWidth = 1 + Math.random() * 2;
    g.beginPath();
    let x = Math.random() * W, y = Math.random() * H;
    g.moveTo(x, y);
    for (let k = 0; k < 5; k++) { x += (Math.random() - 0.5) * 90; y += (Math.random() - 0.5) * 90; g.lineTo(x, y); }
    g.stroke();
  }
});
texAsphalt.wrapS = texAsphalt.wrapT = THREE.RepeatWrapping;
texAsphalt.repeat.set(7, 7);

const texWalk = canvasTex(512, 512, (g, W, H) => {
  g.fillStyle = '#6d7686'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 5000; i++) {
    g.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(20,26,38,0.06)';
    g.fillRect(Math.random() * W, Math.random() * H, 2, 2);
  }
  g.strokeStyle = 'rgba(38,45,58,0.42)'; g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) {
    const p = i * W / 4;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, H); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(W, p); g.stroke();
  }
  g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 2;
  for (let i = 0; i <= 4; i++) {
    const p = i * W / 4 + 3;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, H); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(W, p); g.stroke();
  }
});
texWalk.wrapS = texWalk.wrapT = THREE.RepeatWrapping;
texWalk.repeat.set(5, 5);

/* =====================================================================
   GROUND / BASE
   ===================================================================== */
const matAsphalt = new THREE.MeshToonMaterial({
  color: 0xffffff, map: texAsphalt, gradientMap: gradientMap,
  transparent: true, opacity: 0.64
});

/* reflective wet layer underneath the asphalt */
let reflector = null;
try {
  reflector = new Reflector(new THREE.PlaneGeometry(17.6, 17.6), {
    textureWidth: 320, textureHeight: 320,
    color: 0xc2d0e2, clipBias: 0.0035
  });
  reflector.rotation.x = -Math.PI / 2;
  reflector.position.set(-0.8, 0.007, -0.8);
  scene.add(reflector);
} catch (e) { console.warn('reflector unavailable', e); }

addPlane(root, matAsphalt, 17.6, 17.6, -0.8, 0.016, -0.8);

/* plinth */
const matPlinth = toon(0x171922);
const matPlinthTop = toon(0x2c3040);
addBox(root, matPlinth, 17.65, 1.30, 17.65, -0.8, -0.66, -0.8, { cast: false });
addBox(root, matPlinthTop, 17.94, 0.10, 17.94, -0.8, -0.05, -0.8, { cast: false });
addBox(root, toon(0xb99a5a), 17.97, 0.018, 17.97, -0.8, -0.10, -0.8, { cast: false, outline: false });

/* brass nameplate */
const plateTex = canvasTex(1024, 200, (g, W, H) => {
  const grd = g.createLinearGradient(0, 0, W, H);
  grd.addColorStop(0, '#c9ab6b'); grd.addColorStop(0.4, '#e6cf9b');
  grd.addColorStop(0.62, '#b8975a'); grd.addColorStop(1, '#d9be86');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(60,44,20,0.55)'; g.lineWidth = 6; g.strokeRect(14, 14, W - 28, H - 28);
  g.fillStyle = '#3a2d16';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '600 62px "Yu Mincho","Yu Gothic","Meiryo",serif';
  g.fillText('雨 夜 の コ ン ビ ニ', W / 2, H * 0.44);
  g.font = '400 26px "Yu Gothic","Meiryo",sans-serif';
  g.fillStyle = 'rgba(58,45,22,0.75)';
  g.fillText('RAINY NIGHT  ·  CORNER STORE  ·  1/24', W / 2, H * 0.76);
});
addBox(root, new THREE.MeshBasicMaterial({ map: plateTex }), 2.9, 0.42, 0.03, -0.8, -0.62, 8.04, { outline: false, cast: false });

/* =====================================================================
   SIDEWALKS
   ===================================================================== */
const matWalk = new THREE.MeshToonMaterial({ color: 0xd2d9e6, map: texWalk, gradientMap: gradientMap });
const matCurb = toon(COL.curb);
const matWalkSide = toon(0x606979);

function sidewalk(x0, x1, z0, z1) {
  const w = x1 - x0, d = z1 - z0;
  addBox(root, matWalkSide, w, L.sw, d, (x0 + x1) / 2, L.sw / 2, (z0 + z1) / 2, { cast: false });
  const t = addPlane(root, matWalk, w - 0.02, d - 0.02, (x0 + x1) / 2, L.sw + 0.002, (z0 + z1) / 2);
  t.receiveShadow = true;
  return t;
}

/* corner block (store lot) */
sidewalk(-9.6, 1.4, -9.6, 1.4);
/* right block */
sidewalk(4.8, 8, -9.6, 4.8);
/* far block */
sidewalk(-9.6, 8, 4.8, 8);

/* curbs along the road */
function curbX(z0, z1, x) {
  addBox(root, matCurb, 0.16, 0.19, z1 - z0, x, 0.095, (z0 + z1) / 2, { cast: false });
}
function curbZ(x0, x1, z) {
  addBox(root, matCurb, x1 - x0, 0.19, 0.16, (x0 + x1) / 2, 0.095, z, { cast: false });
}
curbX(-9.6, 1.4, 1.40);
curbX(-9.6, 4.8, 4.82);
curbZ(-9.6, 1.40, 1.40);
curbZ(-9.6, 8, 4.82);

/* gutters (dark strip on the road side of each curb) */
const matGutter = toon(0x191b23);
addBox(root, matGutter, 0.22, 0.02, 11.0, 1.62, 0.028, -4.1, { cast: false, outline: false });
addBox(root, matGutter, 0.22, 0.02, 17.6, 5.04, 0.028, -0.8, { cast: false, outline: false });
addBox(root, matGutter, 17.6, 0.02, 0.22, -0.8, 0.028, 5.04, { cast: false, outline: false });

/* drain grates */
const grateTex = canvasTex(128, 64, (g, W, H) => {
  g.fillStyle = '#0d1016'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#3c4552';
  for (let i = 0; i < 8; i++) g.fillRect(6 + i * 15, 6, 7, H - 12);
  g.strokeStyle = '#4a5462'; g.lineWidth = 3; g.strokeRect(2, 2, W - 4, H - 4);
});
const matGrate = new THREE.MeshBasicMaterial({ map: grateTex });
[[1.58, -6.2], [1.58, -3.0], [1.58, 0.2], [-5.2, 1.58], [-1.9, 1.58]].forEach(p => {
  addBox(root, matGrate, 0.34, 0.03, 0.8, p[0], 0.02, p[1], { cast: false, outline: false });
});

/* manhole */
const manholeTex = canvasTex(128, 128, (g, W, H) => {
  g.fillStyle = '#2b303c'; g.beginPath(); g.arc(W/2, H/2, W/2, 0, 7); g.fill();
  g.strokeStyle = '#454e5e'; g.lineWidth = 4;
  g.beginPath(); g.arc(W/2, H/2, W/2 - 6, 0, 7); g.stroke();
  g.beginPath(); g.arc(W/2, H/2, W/2 - 22, 0, 7); g.stroke();
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    g.beginPath();
    g.moveTo(W/2 + Math.cos(a) * 24, H/2 + Math.sin(a) * 24);
    g.lineTo(W/2 + Math.cos(a) * 50, H/2 + Math.sin(a) * 50);
    g.stroke();
  }
});
addPlane(root, new THREE.MeshBasicMaterial({ map: manholeTex, transparent: true }), 1.1, 1.1, 2.9, 0.03, 3.4);

/* =====================================================================
   ROAD MARKINGS
   ===================================================================== */
const matPaint = toon(COL.paint, { emissive: 0x1b2130 });
const matPaintDim = toon(0xa8b0be, { emissive: 0x141a26 });

/* crosswalk in front of the store (crossing road A, stripes long in X) */
for (let i = 0; i < 8; i++) {
  const z = 1.72 + i * 0.40;
  addBox(root, matPaint, 3.1, 0.012, 0.24, -0.9, 0.028, z, { cast: false, outline: false });
}
/* crosswalk crossing road B (stripes long in Z) */
for (let i = 0; i < 8; i++) {
  const x = 1.72 + i * 0.40;
  addBox(root, matPaint, 0.24, 0.012, 2.9, x, 0.028, 0.15, { cast: false, outline: false });

const PALETTE = [0xff6b6b, 0xffd93d, 0x6bcb77, 0x4d96ff, 0xff8fab, 0xb388ff, 0xffb26b,
                 0x7dd3fc, 0xfef3c7, 0xf87171, 0x34d399, 0xfbbf24, 0x818cf8, 0xf472b6,
                 0xfb923c, 0x38bdf8, 0xa3e635, 0xe879f9];
const goods = [];
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _sc = new THREE.Vector3(), _ps = new THREE.Vector3();
const YAXIS = new THREE.Vector3(0, 1, 0);

function goodsBox(x, y, z, w, h, d, color, ry, rx) {
  _q.setFromAxisAngle(YAXIS, ry || 0);
  if (rx) { const q2 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), rx); _q.multiply(q2); }
  _m4.compose(_ps.set(x, y, z), _q, _sc.set(w, h, d));
  goods.push({ m: _m4.clone(), c: new THREE.Color(color) });
}
const rnd = a => a[Math.floor(Math.random() * a.length)];

function fillShelfRow(x0, x1, y, z, hMax, depth) {
  let x = x0;
  while (x < x1 - 0.055) {
    const w = 0.055 + Math.random() * 0.075;
    if (x + w > x1) break;
    const h = hMax * (0.5 + Math.random() * 0.5);
    const d = depth * (0.75 + Math.random() * 0.25);
    goodsBox(x + w / 2, y + h / 2, z + (Math.random() - 0.5) * 0.02, w, h, d, rnd(PALETTE), 0);
    x += w + 0.014 + Math.random() * 0.022;
  }
}

function hangSign(x, z, text, bg, fg) {
  const tex = canvasTex(512, 180, (g, W, H) => {
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,0.14)'; g.fillRect(0, 0, W, H * 0.18);
    g.fillStyle = fg;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '700 ' + Math.round(H * 0.5) + 'px "Yu Gothic","Meiryo",sans-serif';
    g.fillText(text, W / 2, H * 0.55);
  });
  const g = new THREE.Group();
  g.position.set(x, 2.16, z);
  addBox(g, new THREE.MeshBasicMaterial({ map: tex }), 0.86, 0.30, 0.03, 0, 0, 0, { outline: false, cast: false });
  addBox(g, toon(0xd8d2c4), 0.90, 0.035, 0.05, 0, 0.17, 0, { outline: false, cast: false });
  addCyl(g, toon(0x9aa3ae), 0.008, 0.30, -0.30, 0.32, 0, { outline: false, cast: false });
  addCyl(g, toon(0x9aa3ae), 0.008, 0.30, 0.30, 0.32, 0, { outline: false, cast: false });
  root.add(g);
  return g;
}

function posterTex(bg, fg, title, sub, accent) {
  return canvasTex(256, 384, (g, W, H) => {
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.fillStyle = accent; g.beginPath(); g.arc(W * 0.5, H * 0.42, W * 0.30, 0, 7); g.fill();
    g.fillStyle = fg;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '700 44px "Yu Gothic","Meiryo",sans-serif';
    g.fillText(title, W / 2, H * 0.72);
    g.font = '500 22px "Yu Gothic","Meiryo",sans-serif';
    g.fillText(sub, W / 2, H * 0.82);
    g.strokeStyle = fg; g.lineWidth = 5; g.strokeRect(10, 10, W - 20, H - 20);
  });
}

(function buildGoods() {
  if (!goods.length) return;
  const mat = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: gradientMap });
  const mesh = new THREE.InstancedMesh(BOX, mat, goods.length);
  const c = new THREE.Color();
  goods.forEach((g, i) => {
    mesh.setMatrixAt(i, g.m);
    mesh.setColorAt(i, g.c);
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  root.add(mesh);
})();

/* ---------------------------------------------------------- vending machine */
function vendingTex(theme) {
  const isRed = theme === 'red';
  return canvasTex(512, 1024, (g, W, H) => {
    g.fillStyle = isRed ? '#e8e3dc' : '#eef4f8'; g.fillRect(0, 0, W, H);
    /* header */
    const hg = g.createLinearGradient(0, 0, 0, H * 0.13);
    hg.addColorStop(0, isRed ? '#d2453a' : '#2f6fb5');
    hg.addColorStop(1, isRed ? '#a8302a' : '#1f4f8a');
    g.fillStyle = hg; g.fillRect(0, 0, W, H * 0.13);
    g.fillStyle = '#ffffff';
    g.font = '800 54px "Yu Gothic","Meiryo",Arial,sans-serif';
    g.textBaseline = 'middle';
    g.fillText(isRed ? 'HOT & COLD' : 'DRINK BAR', 26, H * 0.065);
    /* drink rows */
    const cols = 5, rows = 3;
    const top = H * 0.16, areaH = H * 0.56;
    const cw = (W - 40) / cols, ch = areaH / rows;
    const cans = ['#e2574c', '#3f8fd6', '#f2c14e', '#5fbf8a', '#f0f0f0', '#8a6bd1',
                  '#e88a3c', '#4fb8c9', '#e05a8a', '#c9d64f', '#2f4f7a', '#f2f2f2'];
    for (let r = 0; r < rows; r++) {
      g.fillStyle = 'rgba(190,205,220,0.55)';
      g.fillRect(16, top + r * ch - 4, W - 32, 4);
      for (let c = 0; c < cols; c++) {
        const cx = 20 + c * cw + cw * 0.14, cwid = cw * 0.72;
        const cy = top + r * ch + ch * 0.10, chei = ch * 0.60;
        g.fillStyle = cans[(r * cols + c) % cans.length];
        g.beginPath();
        if (g.roundRect) g.roundRect(cx, cy, cwid, chei, 9); else g.rect(cx, cy, cwid, chei);
        g.fill();
        g.fillStyle = 'rgba(255,255,255,0.72)';
        g.fillRect(cx + cwid * 0.12, cy + chei * 0.26, cwid * 0.76, chei * 0.16);
        g.fillStyle = '#ffffff';
        g.font = '700 20px Arial';
        g.textAlign = 'center';
        g.fillText((120 + ((r + c) % 4) * 10) + '', cx + cwid / 2, cy + chei + 20);
        g.textAlign = 'left';
      }
    }
    /* bottom slot */
    g.fillStyle = '#2a3038'; g.fillRect(20, H * 0.76, W - 40, H * 0.10);
    g.fillStyle = '#11151b'; g.fillRect(60, H * 0.79, W - 120, H * 0.045);
    g.fillStyle = '#454e5a'; g.fillRect(W * 0.72, H * 0.885, W * 0.18, H * 0.05);
    g.fillStyle = '#8f99a5'; g.fillRect(W * 0.74, H * 0.895, W * 0.14, H * 0.012);
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.font = '700 26px "Yu Gothic","Meiryo",sans-serif';
    g.fillText('つめた〜い', 26, H * 0.955);
  });
}

const matWire = toon(0x151922);
function wireBetween(a, b, sag, r) {
  const pts = [];
  for (let i = 0; i <= 16; i++) {
    const t = i / 16;
    const p = new THREE.Vector3().lerpVectors(a, b, t);
    p.y -= Math.sin(Math.PI * t) * sag;
    pts.push(p);
  }
  const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 22, r || 0.017, 5, false);
  const m = new THREE.Mesh(geo, matWire);
  m.castShadow = false;
  root.add(m);
  return m;
}
function utilityPole(x, z, h) {
  const g = new THREE.Group();

    addBox(g, toon(0x59616d), 1.30, 0.07, 0.07, 0, h - 0.55 - i * 0.55, 0, { outline: false });
    for (let k = -1; k <= 1; k++) {
      addCyl(g, toon(0xcfd6df), 0.045, 0.13, k * 0.55, h - 0.44 - i * 0.55, 0, { outline: false, cast: false });

  addCyl(g, toon(0x8d97a3), 0.20, 0.62, 0.26, h - 1.55, 0, { outline: false });
  addBox(g, toon(0x4b5360), 0.16, 0.34, 0.14, -0.16, h - 1.10, 0, { outline: false, cast: false });
  root.add(g);
  return g;
}

function railRun(axis, fixed, from, to) {
  const mat = toon(0xdde4ec);
  const len = Math.abs(to - from);
  const n = Math.max(1, Math.round(len / 1.9));
  for (let i = 0; i <= n; i++) {
    const p = from + (to - from) * (i / n);
    if (axis === 'x') addCyl(root, mat, 0.045, 0.78, p, L.sw + 0.39, fixed, { outline: false });
    else addCyl(root, mat, 0.045, 0.78, fixed, L.sw + 0.39, p, { outline: false });
  }
  for (let k = 0; k < 2; k++) {
    const y = L.sw + 0.42 + k * 0.28;
    if (axis === 'x') addCyl(root, mat, 0.035, len, (from + to) / 2, y, fixed, { rot: [0, 0, Math.PI / 2], outline: false });
    else addCyl(root, mat, 0.035, len, fixed, y, (from + to) / 2, { rot: [Math.PI / 2, 0, 0], outline: false });
  }
}

function facadeTex(base, lit, cols, rows, litRate) {
  return canvasTex(256, 512, (g, W, H) => {
    g.fillStyle = base; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.10)';
      g.fillRect(Math.random() * W, Math.random() * H, 3, 3);
    }
    const cw = W / cols, ch = H / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = c * cw + cw * 0.18, y = r * ch + ch * 0.20;
        const on = Math.random() < litRate;
        g.fillStyle = on ? lit : 'rgba(12,16,26,0.92)';
        g.fillRect(x, y, cw * 0.62, ch * 0.44);
        if (on) {
          g.fillStyle = 'rgba(255,255,255,0.35)';
          g.fillRect(x, y, cw * 0.62, ch * 0.10);
        }
        g.fillStyle = 'rgba(0,0,0,0.25)';
        g.fillRect(x, y + ch * 0.44, cw * 0.62, 3);
      }
      g.fillStyle = 'rgba(0,0,0,0.20)';
      g.fillRect(0, r * ch + ch * 0.72, W, 4);
    }
  });
}

   OPTIMISATION — bake every box outline into a single line batch
   ===================================================================== */
(function mergeOutlines() {
  root.updateMatrixWorld(true);
  const verts = [];
  const kill = [];
  root.traverse(o => {
    if (o.isLineSegments && o.material === lineMat) {
      const g = o.geometry.clone();
      g.applyMatrix4(o.matrixWorld);
      const a = g.attributes.position.array;
      for (let i = 0; i < a.length; i++) verts.push(a[i]);
      g.dispose();
      kill.push(o);
    }
  });
  kill.forEach(o => { if (o.parent) o.parent.remove(o); });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  const merged = new THREE.LineSegments(geo, lineMat);
  merged.frustumCulled = false;
  merged.renderOrder = 1;
  scene.add(merged);
})();

const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: [
    'uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;',
    'void main(){',
    '  vec2 uv = vUv;',
    '  vec3 c = texture2D(tDiffuse, uv).rgb;',
    '  vec2 p = uv - 0.5;',
    '  float d = length(p * vec2(1.0, 1.05));',
    '  float vig = smoothstep(0.92, 0.22, d);',
    '  c *= mix(0.48, 1.0, vig);',
    '  float lum = dot(c, vec3(0.299, 0.587, 0.114));',
    '  c = mix(c * vec3(0.86, 0.93, 1.12), c, smoothstep(0.0, 0.55, lum));',
    '  c = mix(c, c * vec3(1.08, 1.01, 0.93), smoothstep(0.25, 0.95, lum));',
    '  c *= 1.00;',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n')
};
const gradePass = new ShaderPass(GradeShader);
composer.addPass(gradePass);

/* =====================================================================
   ANIMATION
   ===================================================================== */
const clock = new THREE.Clock();
let idle = 0;

controls.addEventListener('start', () => { controls.autoRotate = false; idle = 0; });
controls.addEventListener('end', () => { idle = 0; });

function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function doorAmount(t) {
  const c = 10.0, x = t % c;
  if (x < 1.2) return 0;
  if (x < 2.1) return easeInOut((x - 1.2) / 0.9);
  if (x < 5.4) return 1;
  if (x < 6.3) return 1 - easeInOut((x - 5.4) / 0.9);
  return 0;
}

let flicker = 1, flickerTarget = 1, flickerTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* sliding door */
  const da = doorAmount(t);
  doorGroupL.position.x = -da * 0.86;
  doorGroupR.position.x = da * 0.86;

  /* sign flicker */
  flickerTimer -= dt;
  if (flickerTimer <= 0) {
    flickerTarget = Math.random() < 0.10 ? (0.45 + Math.random() * 0.25) : (0.95 + Math.random() * 0.07);
    flickerTimer = 0.05 + Math.random() * 0.55;
  }
  flicker += (flickerTarget - flicker) * Math.min(1, dt * 22);
  signMatF.color.setScalar(flicker);
  signMatS.color.setScalar(flicker);
  signGlowF.material.opacity = 0.30 * flicker;
  signGlowS.material.opacity = 0.30 * flicker;

  /* traffic signal */
  const ct = t % 13.0;
  const active = ct < 5.6 ? 0 : (ct < 7.2 ? 1 : 2);
  for (let i = 0; i < signalLamps.length; i++) {
    const L2 = signalLamps[i];
    const k = i === active ? 2.2 : 0.10;
    L2.mat.color.copy(L2.base).multiplyScalar(k);
    L2.gl.material.opacity = i === active ? 0.55 : 0.0;
  }

  /* gentle idle auto-rotation */
  if (!controls.autoRotate && !window.__lockCam) {
    idle += dt;
    if (idle > 9) controls.autoRotate = true;
  }
  controls.update();

  gradePass.uniforms.uTime.value = t;
  composer.render();
}
animate();

/* ------------------------------------------------------------------ resize */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
});

/* small keyboard-free interaction: double click resets view */
renderer.domElement.addEventListener('dblclick', () => {
  camera.position.set(10.5, 9.3, 13.0);
  controls.target.set(-2.4, 1.60, -2.4);
  controls.update();
});

</script>
<script>
/* multi-mirror loader: three.js is fetched from whichever CDN answers first */
(function () {
  var MIRRORS = [
    'https://fastly.jsdelivr.net/npm/three@0.160.0/',
    'https://unpkg.com/three@0.160.0/',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/',
    'https://gcore.jsdelivr.net/npm/three@0.160.0/'
  ];

  function fail() {
    if (document.querySelector('#app canvas')) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8c96ad;font:14px/1.7 -apple-system,"Microsoft YaHei",sans-serif;text-align:center;letter-spacing:.05em';
    d.textContent = '无法加载 3D 运行库（three.js CDN 不可达），请检查网络后刷新。';
    document.body.appendChild(d);
  }

  function start(base) {
    var map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({
      imports: { 'three': base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' }
    });
    document.head.appendChild(map);

    var code = document.getElementById('appsrc').textContent;
    var url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    var s = document.createElement('script');
    s.type = 'module';
    s.src = url;
    document.body.appendChild(s);
  }

  function probe(i) {
    if (i >= MIRRORS.length) { start(MIRRORS[1]); setTimeout(fail, 12000); return; }
    var ctl = new AbortController();
    var to = setTimeout(function () { ctl.abort(); }, 6000);
    fetch(MIRRORS[i] + 'build/three.module.js', { method: 'HEAD', signal: ctl.signal })
      .then(function (r) { clearTimeout(to); if (r.ok) start(MIRRORS[i]); else probe(i + 1); })
      .catch(function () { clearTimeout(to); probe(i + 1); });
  }
  probe(0);
})();
</script>
